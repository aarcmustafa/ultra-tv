name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-merge2-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-merge2-

      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
          done
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "done"

      - name: Fix TopBar text
        working-directory: source/android-native
        run: |
          T="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$T" ]; then
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$T"
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$T"
          fi

      - name: Global replace in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "done"

      - name: Create STTITEN PNG assets
        working-directory: source/android-native
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          convert -size 1200x400 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          convert -size 512x512 xc:"#0E1116" \
            -font DejaVu-Sans-Bold -pointsize 80 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN" \
            app/src/main/res/drawable-nodpi/sttiten_icon.png
          ls -la app/src/main/res/drawable-nodpi/

      - name: Replace XML logos in all drawable folders
        working-directory: source/android-native
        run: |
          for DIR in app/src/main/res/drawable*; do
            case "$DIR" in *nodpi*) continue ;; esac
            [ -d "$DIR" ] || continue
            for F in "$DIR"/*.xml; do
              [ -f "$F" ] || continue
              BN=$(basename "$F")
              case "$BN" in
                ic_opensubtitles_logo.xml|ic_tmdb_logo.xml) continue ;;
                *background*|*_bg*) continue ;;
              esac
              if grep -qE "<vector|<shape|<layer-list" "$F" 2>/dev/null; then
                echo "Replacing: $F"
                if echo "$BN" | grep -qiE "launcher|icon"; then IMG="sttiten_icon"; else IMG="sttiten_logo"; fi
                cat > "$F" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/$IMG"
              android:gravity="center" />
          XMLEOF
              fi
            done
          done
          if [ -d "app/src/main/res/mipmap-anydpi-v26" ]; then
            for F in app/src/main/res/mipmap-anydpi-v26/*.xml; do
              [ -f "$F" ] || continue
              BN=$(basename "$F")
              [ "$BN" = "ic_launcher_round.xml" ] && continue
              cat > "$F" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/sttiten_background" />
              <foreground android:drawable="@drawable/sttiten_icon" />
          </adaptive-icon>
          XMLEOF
            done
          fi
          echo "XML replaced"

      - name: Add color resource
        working-directory: source/android-native
        run: |
          C="app/src/main/res/values/colors.xml"
          if [ ! -f "$C" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n' > "$C"
          fi
          if ! grep -q "sttiten_background" "$C"; then
            sed -i 's|</resources>|    <color name="sttiten_background">#0E1116</color>\n</resources>|' "$C"
          fi
          echo "color added"

      # ============================================================
      # StreamPref + Settings Activity
      # ============================================================
      - name: Create StreamPref
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          mkdir -p "$PKG"
          cat > "$PKG/StreamPref.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.content.Context
          object StreamPref {
              private const val PREFS = "sttiten_ext"
              private const val KEY = "stream_ext"
              private const val DEFAULT = "m3u8"
              @Volatile private var appCtx: Context? = null
              @Volatile private var cached: String? = null
              fun init(context: Context) { if (appCtx == null) appCtx = context.applicationContext }
              fun getExt(): String {
                  cached?.let { return it }
                  val c = appCtx ?: return DEFAULT
                  val v = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, DEFAULT) ?: DEFAULT
                  cached = v
                  return v
              }
              fun getSuffix(): String = if (getExt().isEmpty()) "" else "." + getExt()
              fun setExt(ext: String) {
                  cached = ext
                  appCtx?.getSharedPreferences(PREFS, Context.MODE_PRIVATE)?.edit()?.putString(KEY, ext)?.apply()
              }
          }
          KOTLIN_EOF
          echo "StreamPref created"

      - name: Create StreamPrefInitProvider
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          cat > "$PKG/StreamPrefInitProvider.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.database.Cursor
          import android.net.Uri
          class StreamPrefInitProvider : ContentProvider() {
              override fun onCreate(): Boolean { context?.let { StreamPref.init(it) }; return true }
              override fun query(u: Uri, p: Array<out String>?, s: String?, sa: Array<out String>?, so: String?): Cursor? = null
              override fun getType(u: Uri): String? = null
              override fun insert(u: Uri, v: ContentValues?): Uri? = null
              override fun delete(u: Uri, s: String?, sa: Array<out String>?): Int = 0
              override fun update(u: Uri, v: ContentValues?, s: String?, sa: Array<out String>?): Int = 0
          }
          KOTLIN_EOF
          echo "Provider created"

      - name: Create StreamSettingsActivity
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          cat > "$PKG/StreamSettingsActivity.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          class StreamSettingsActivity : Activity() {
              private lateinit var layout: LinearLayout
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  StreamPref.init(this)
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0E1116")) }
                  layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 60, 60, 60)
                  }
                  scroll.addView(layout)
                  setContentView(scroll)
                  buildUi()
              }
              private fun buildUi() {
                  layout.removeAllViews()
                  layout.addView(TextView(this).apply {
                      text = "STTITEN IP TV"
                      setTextColor(Color.parseColor("#FF3A2F"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 42f)
                      gravity = Gravity.CENTER
                  })
                  layout.addView(TextView(this).apply {
                      text = "اختر امتداد البث المباشر"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 40)
                  })
                  val current = StreamPref.getExt()
                  val options = listOf(
                      "m3u8" to "m3u8  (موصى به)",
                      "ts" to "ts  (تقليدي)",
                      "m3u" to "m3u",
                      "" to "بدون امتداد"
                  )
                  for ((value, label) in options) {
                      val isCurrent = (value == current)
                      layout.addView(Button(this).apply {
                          text = if (isCurrent) "✓  $label" else label
                          setTextColor(Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                          setBackgroundColor(if (isCurrent) Color.parseColor("#FF3A2F") else Color.parseColor("#1A1D23"))
                          setPadding(40, 30, 40, 30)
                          setOnClickListener { StreamPref.setExt(value); buildUi() }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = 15 }
                      })
                  }
                  layout.addView(TextView(this).apply {
                      text = "الإعداد الحالي: $current"
                      setTextColor(Color.parseColor("#FF3A2F"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                      gravity = Gravity.CENTER
                      setPadding(0, 40, 0, 0)
                  })
                  layout.addView(Button(this).apply {
                      text = "▶  ابدأ المشاهدة"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      setBackgroundColor(Color.parseColor("#27AE60"))
                      setPadding(40, 40, 40, 40)
                      setOnClickListener { openMainApp() }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = 50 }
                  })
                  layout.addView(TextView(this).apply {
                      text = "للعودة إلى هذه الشاشة، اضغط زر MENU على ريموت التلفاز"
                      setTextColor(Color.parseColor("#888888"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      gravity = Gravity.CENTER
                      setPadding(0, 40, 0, 0)
                  })
              }
              private fun openMainApp() {
                  val candidates = listOf(
                      "com.ultratv.tv.nativeapp.MainActivity",
                      "com.ultratv.tv.nativeapp.MainActivityPetrol",
                      "com.ultratv.tv.nativeapp.MainActivityCobalt"
                  )
                  for (cls in candidates) {
                      try {
                          val i = Intent()
                          i.setClassName(packageName, cls)
                          i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                          startActivity(i)
                          return
                      } catch (e: Exception) { }
                  }
                  packageManager.getLaunchIntentForPackage(packageName)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      if (it.component?.className != this::class.java.name) startActivity(it)
                  }
              }
          }
          KOTLIN_EOF
          echo "StreamSettingsActivity created"

      # ============================================================
      # 🔥 Patch MainActivity: MENU key opens Settings
      # ============================================================
      - name: Patch MainActivity to open Settings on MENU key
        working-directory: source/android-native
        run: |
          MAIN=$(find app/src/main/kotlin -name "MainActivity.kt" | head -1)
          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            find app/src/main/kotlin -name "Main*.kt"
            exit 0
          fi
          echo "Found: $MAIN"
          
          # إضافة imports
          if ! grep -q "com.ultratv.tv.nativeapp.ext.StreamSettingsActivity" "$MAIN"; then
            sed -i '0,/^import /s//import com.ultratv.tv.nativeapp.ext.StreamSettingsActivity\nimport /' "$MAIN"
          fi
          if ! grep -q "android.content.Intent" "$MAIN"; then
            sed -i '0,/^import /s//import android.content.Intent\nimport /' "$MAIN"
          fi
          
          # إضافة onKeyDown قبل onCreate
          if ! grep -q "onKeyDown" "$MAIN"; then
            # نبحث عن onCreate وندرج قبله
            perl -i -pe 's|(override fun onCreate)|override fun onKeyDown(keyCode: Int, event: android.view.KeyEvent?): Boolean {\n        if (keyCode == android.view.KeyEvent.KEYCODE_MENU || keyCode == android.view.KeyEvent.KEYCODE_SETTINGS || keyCode == android.view.KeyEvent.KEYCODE_INFO || keyCode == android.view.KeyEvent.KEYCODE_PROG_RED) {\n            try {\n                val i = Intent(this, StreamSettingsActivity::class.java)\n                i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)\n                startActivity(i)\n                return true\n            } catch (e: Exception) { }\n        }\n        return super.onKeyDown(keyCode, event)\n    }\n\n    $1|' "$MAIN"
          fi
          
          echo "=== After patch ==="
          grep -n "onKeyDown\|StreamSettingsActivity\|Intent" "$MAIN" | head -10

      # ============================================================
      # Configure Manifest
      # ============================================================
      - name: Configure Manifest (Settings as launcher, Main as normal)
        working-directory: source/android-native
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          
          # إضافة Provider + Activity Settings
          if ! grep -q "StreamSettingsActivity" "$MANIFEST"; then
            perl -i -pe 's|(</application>)|    <provider\n        android:name="com.ultratv.tv.nativeapp.ext.StreamPrefInitProvider"\n        android:authorities="com.ultratv.tv.nativeapp.streampref"\n        android:exported="false" />\n    <activity\n        android:name="com.ultratv.tv.nativeapp.ext.StreamSettingsActivity"\n        android:exported="true"\n        android:label="STTITEN IP TV"\n        android:icon="@drawable/sttiten_icon">\n        <intent-filter>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>\n    </activity>\n$1|' "$MANIFEST"
          fi
          
          # إزالة LAUNCHER من MainActivity
          perl -0777 -i -pe 's|(<activity[^>]*android:name="com\.ultratv\.tv\.nativeapp\.MainActivity"[^>]*>)(.*?)<intent-filter>.*?</intent-filter>|$1$2|gs' "$MANIFEST"
          
          # التحقق من أن MainActivity موجودة بدون launcher
          perl -0777 -i -pe 's|(<activity[^>]*android:name="com\.ultratv\.tv\.nativeapp\.MainActivityPetrol"[^>]*>)(.*?)<intent-filter>.*?</intent-filter>|$1$2|gs' "$MANIFEST"
          perl -0777 -i -pe 's|(<activity[^>]*android:name="com\.ultratv\.tv\.nativeapp\.MainActivityCobalt"[^>]*>)(.*?)<intent-filter>.*?</intent-filter>|$1$2|gs' "$MANIFEST"
          
          echo "=== Verify ==="
          grep -c "LAUNCHER" "$MANIFEST"
          grep -B 1 -A 3 "StreamSettingsActivity" "$MANIFEST" | head -12

      # ============================================================
      # Patch XtreamClient
      # ============================================================
      - name: Patch XtreamClient
        working-directory: source/android-native
        run: |
          XT="app/src/main/kotlin/com/ultratv/tv/nativeapp/data/xtream/XtreamClient.kt"
          if [ ! -f "$XT" ]; then
            echo "ERROR: XtreamClient not found"
            exit 1
          fi
          sed -i 's|pathPrefix(p, "live")}\$sid\.ts"|pathPrefix(p, "live")}$sid${com.ultratv.tv.nativeapp.ext.StreamPref.getSuffix()}"|g' "$XT"
          echo "=== Verify ==="
          grep -n "StreamPref.getSuffix" "$XT" || echo "FAILED"

      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          A="app/build.gradle.kts"
          if [ -f "$A" ]; then
            if ! grep -q 'abiFilters' "$A"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$A"
            fi
            if ! grep -q 'useLegacyPackaging' "$A"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$A"
            fi
          fi

      - 
