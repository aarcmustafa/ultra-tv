name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-ext-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-ext-

      - name: Remove any existing QR files
        working-directory: source/android-native
        run: |
          rm -rf app/src/main/kotlin/com/ultratv/tv/nativeapp/qr
          echo "QR files removed"

      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "done"

      - name: Fix TopBar text
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$TARGET" ]; then
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
          fi

      - name: Global replace in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "done"

      - name: Create StreamPref helper
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          mkdir -p "$PKG"
          cat > "$PKG/StreamPref.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.content.Context
          import android.net.Uri
          object StreamPref {
              private const val PREFS = "sttiten_ext"
              private const val KEY = "stream_ext"
              private const val DEFAULT = "m3u8"
              private var appCtx: Context? = null
              fun init(context: Context) {
                  appCtx = context.applicationContext
              }
              fun getExt(): String {
                  val c = appCtx ?: return DEFAULT
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, DEFAULT) ?: DEFAULT
              }
              fun setExt(ext: String) {
                  val c = appCtx ?: return
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, ext).apply()
              }
              fun applyTo(uri: Uri): Uri {
                  val ext = getExt()
                  if (ext.isEmpty()) return uri
                  val path = uri.lastPathSegment ?: return uri
                  if (!path.contains(".")) return uri
                  val base = path.substringBeforeLast('.')
                  val newPath = "$base.$ext"
                  return uri.buildUpon()
                      .path(uri.path?.substringBeforeLast('/') + "/" + newPath)
                      .build()
              }
              fun applyTo(url: String): String {
                  val ext = getExt()
                  if (ext.isEmpty()) return url
                  val questionMark = url.indexOf('?')
                  val base = if (questionMark > 0) url.substring(0, questionMark) else url
                  val query = if (questionMark > 0) url.substring(questionMark) else ""
                  if (!base.contains(".")) return url
                  val noExt = base.substringBeforeLast('.')
                  return "$noExt.$ext$query"
              }
          }
          KOTLIN_EOF
          echo "StreamPref created"

      - name: Create Stream Settings Activity
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          cat > "$PKG/StreamSettingsActivity.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          class StreamSettingsActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  StreamPref.init(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0E1116"))
                      setPadding(40, 40, 40, 40)
                  }
                  layout.addView(TextView(this).apply {
                      text = "STTITEN IP TV"
                      setTextColor(Color.parseColor("#FF3A2F"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 36f)
                      gravity = Gravity.CENTER
                  })
                  layout.addView(TextView(this).apply {
                      text = "اختر امتداد البث"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 20f)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 20)
                  })
                  val current = StreamPref.getExt()
                  val options = listOf(
                      "m3u8" to "m3u8 (موصى به)",
                      "ts" to "ts (تقليدي)",
                      "m3u" to "m3u",
                      "" to "بدون امتداد"
                  )
                  for ((value, label) in options) {
                      val isCurrent = (value == current)
                      layout.addView(Button(this).apply {
                          text = if (isCurrent) "✓ $label" else label
                          setTextColor(Color.WHITE)
                          setBackgroundColor(
                              if (isCurrent) Color.parseColor("#FF3A2F")
                              else Color.parseColor("#1A1D23")
                          )
                          setPadding(30, 25, 30, 25)
                          setOnClickListener {
                              StreamPref.setExt(value)
                              recreate()
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = 12 }
                      })
                  }
                  layout.addView(TextView(this).apply {
                      text = "الإعداد الحالي: $current"
                      setTextColor(Color.parseColor("#888888"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 0)
                  })
                  setContentView(layout)
              }
          }
          KOTLIN_EOF
          echo "StreamSettingsActivity created"

      - name: Register Stream Settings Activity in Manifest
        working-directory: source/android-native
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "StreamSettingsActivity" "$MANIFEST"; then
              perl -i -pe 's|(</application>)|    <activity\n        android:name="com.ultratv.tv.nativeapp.ext.StreamSettingsActivity"\n        android:exported="true"\n        android:label="STTITEN Settings">\n        <intent-filter>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>\n    </activity>\n$1|' "$MANIFEST"
            fi
          fi
          echo "manifest updated"

      - name: Initialize StreamPref in ExoEngine
        working-directory: source/android-native
        run: |
          EXO="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/player/engine/ExoEngine.kt"
          if [ -f "$EXO" ]; then
            echo "=== Before ==="
            grep -n "DefaultHttpDataSource\|ResolvingDataSource\|import" "$EXO" | head -20
            
            # إضافة import
            if ! grep -q "com.ultratv.tv.nativeapp.ext.StreamPref" "$EXO"; then
              sed -i '0,/^import /s//import com.ultratv.tv.nativeapp.ext.StreamPref\nimport /' "$EXO"
            fi
            if ! grep -q "ResolvingDataSource" "$EXO"; then
              sed -i '0,/^import /s//import androidx.media3.datasource.ResolvingDataSource\nimport /' "$EXO"
            fi
            
            # تعديل DefaultHttpDataSource لاستخدام ResolvingDataSource
            if grep -q "DefaultHttpDataSource.Factory()" "$EXO" && ! grep -q "ResolvingDataSource" "$EXO"; then
              perl -i -pe 's|(val http = DefaultHttpDataSource\.Factory\(\)[^\n]*\n)|$1        val httpResolving = ResolvingDataSource.Factory(http) { dataSpec ->\n            val newUri = StreamPref.applyTo(dataSpec.uri)\n            dataSpec.buildUpon().setUri(newUri).build()\n        }\n|' "$EXO"
            fi
            
            # استبدال استخدام http بـ httpResolving في مكان ما إن أمكن
            # ملاحظة: نترك http كما هو، ويمكن استخدام httpResolving يدوياً
            
            echo "=== After ==="
            grep -n "StreamPref\|ResolvingDataSource\|DefaultHttpDataSource" "$EXO" | head -10
          else
            echo "ExoEngine.kt not found"
          fi

      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          A="app/build.gradle.kts"
          if [ -f "$A" ]; then
            if ! grep -q 'abiFilters' "$A"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$A"
            fi
            if ! grep -q 'useLegacyPackaging' "$A"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$A"
            fi
          fi
          echo "universal configured"

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Ext-Switch
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
