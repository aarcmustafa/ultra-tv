name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. استنساخ المستودع
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      # 2. تشخيص سريع
      - name: Diagnostic - Show structure
        working-directory: source
        run: |
          echo "===== محتويات الجذر ====="
          ls -la
          
          echo ""
          echo "===== هل يوجد android-app؟ ====="
          if [ -d "android-app" ]; then
            echo "نعم، موجود"
          else
            echo "لا، محذوف ✅"
          fi
          
          echo ""
          echo "===== محتويات android-native ====="
          ls -la android-native 2>/dev/null || echo "غير موجود"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-final2-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-final2-

      # ============================================================
      # 3. تغيير الاسم في strings.xml
      # ============================================================
      - name: Change app name in strings.xml
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            echo "--- تعديل: $f ---"
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
          done
          
          # إنشاء ملف عربي
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          
          echo ""
          echo "===== التحقق ====="
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml

      # ============================================================
      # 4. استبدال "ULTRA TV" في ملفات Kotlin (الشريط العلوي)
      # ============================================================
      - name: Replace brand in Kotlin files
        working-directory: source/android-native
        run: |
          # استبدال مباشر في CloudPairingDialog.kt (المسؤول عن الشريط العلوي)
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$TARGET" ]; then
            echo "===== قبل التعديل ====="
            grep -n "ULTRA\|Ultra\|UTV" "$TARGET" | head -5
            
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            
            echo ""
            echo "===== بعد التعديل ====="
            grep -n "STTITEN\|ULTRA\|Ultra\|UTV" "$TARGET" | head -5
          fi
          
          # استبدال شامل في كل ملفات Kotlin
          echo ""
          echo "===== استبدال شامل في كل Kotlin ====="
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          
          echo ""
          echo "===== التحقق النهائي ====="
          REMAINING=$(grep -rl '"ULTRA TV"\|"Ultra TV"\|"UTV"' --include="*.kt" . 2>/dev/null | wc -l)
          echo "ملفات Kotlin لا تزال بها الاسم القديم: $REMAINING"

      # ============================================================
      # 5. استبدال في كل ملفات XML
      # ============================================================
      - name: Replace in all XML files
        working-directory: source/android-native/app/src/main/res
        run: |
          find . -name "*.xml" -type f | while read f; do
            if grep -qE "UTV|Ultra TV|ULTRA TV|TV ULTRA" "$f" 2>/dev/null; then
              echo "✅ تعديل: $f"
              sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
              sed -i 's|android:text="UTV"|android:text="STTITEN IP TV"|g' "$f"
              sed -i 's|android:text="ULTRA TV"|android:text="STTITEN IP TV"|g' "$f"
            fi
          done
          
          echo ""
          echo "===== التحقق ====="
          REMAINING=$(grep -rl "UTV\|Ultra TV\|ULTRA TV" --include="*.xml" . 2>/dev/null | wc -l)
          echo "ملفات XML لا تزال بها الاسم القديم: $REMAINING"

      # ============================================================
      # 6. دمج المعماريتين في APK واحد
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
              echo "✅ تم إضافة abiFilters"
            else
              echo "ℹ️ abiFilters موجود مسبقاً"
            fi
            
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
              echo "✅ تم إضافة packaging"
            fi
            
            echo ""
            echo "===== التحقق ====="
            grep -n -A 3 "abiFilters" "$APP_GRADLE" | head -8
          fi

      # ============================================================
      # 7. إعدادات Gradle
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 8. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show APK info
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;
          
          echo ""
          echo "===== المعماريات المضمنة ====="
          for apk in $(find . -name "*.apk" | head -1); do
            unzip -l "$apk" | grep "\.so$" | awk '{print $4}' | grep -oE "lib/[^/]+" | sort -u
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
