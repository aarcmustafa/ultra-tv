name: Build STTITEN IP TV - Genius Edition

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-genius-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-genius-

      # ============================================================
      # 🔍 المرحلة 1: مسح شامل - كل ملف يحتوي ULTRA/UTV بأي امتداد
      # ============================================================
      - name: "Phase 1 - Exhaustive scan (ALL file types)"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🔍 كل ملف يحتوي ULTRA أو UTV (جميع الامتدادات)"
          echo "===================================================="
          
          # البحث في كل الملفات (وليس فقط kt/xml)
          find . -type f -not -path "*/build/*" -not -path "*/.git/*" 2>/dev/null | while read f; do
            if file "$f" | grep -qE "text|ASCII|UTF-8|Unicode"; then
              if grep -qE "ULTRA|Ultra|UTV|ultra|utv" "$f" 2>/dev/null; then
                echo "📄 $f"
              fi
            fi
          done | sort | head -50
          
          echo ""
          echo "===================================================="
          echo "🔍 كل الأسطر التي تحتوي ULTRA/UTV (تفصيلي)"
          echo "===================================================="
          
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.json" -o -name "*.kts" -o -name "*.gradle" -o -name "*.properties" -o -name "*.txt" \) \
            -not -path "*/build/*" 2>/dev/null | while read f; do
            MATCHES=$(grep -nE '"ULTRA|"Ultra|"UTV|>ULTRA|>Ultra|>UTV|ULTRA TV|Ultra TV|TV ULTRA' "$f" 2>/dev/null | head -5)
            if [ -n "$MATCHES" ]; then
              echo "--- $f ---"
              echo "$MATCHES"
            fi
          done | head -80

      # ============================================================
      # 🔥 المرحلة 2: استبدال ذكي - يحافظ على البنية
      # ============================================================
      - name: "Phase 2 - Genius replace (structure-preserving)"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🔥 بدء الاستبدال الذكي"
          echo "===================================================="
          
          # نستخدم ترتيب مهم: من الأطول إلى الأقصر لتجنب الاستبدال الجزئي
          # الترتيب: ULTRA TV → Ultra TV → UltraTV → TV ULTRA → UTV → ULTRA (وحيد)
          
          COUNT=0
          
          # المرور على جميع الملفات النصية
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.json" -o -name "*.kts" -o -name "*.gradle" -o -name "*.properties" \) \
            -not -path "*/build/*" 2>/dev/null | while read f; do
            
            # نسخة احتياطية
            cp "$f" "$f.bak" 2>/dev/null
            
            # 1. النص الكامل "ULTRA TV"
            sed -i 's|ULTRA TV|STTITEN IP TV|g' "$f" 2>/dev/null
            sed -i 's|Ultra TV|STTITEN IP TV|g' "$f" 2>/dev/null
            sed -i 's|TV ULTRA|STTITEN IP TV|g' "$f" 2>/dev/null
            sed -i 's|UltraTV|STTITEN IP TV|g' "$f" 2>/dev/null
            
            # 2. "UTV" كامل
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f" 2>/dev/null
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f" 2>/dev/null
            sed -i 's|= UTV|= STTITEN IP TV|g' "$f" 2>/dev/null
            
            # 3. "ULTRA" منفرد في نصوص Kotlin فقط (بين علامتي تنصيص)
            sed -i 's|"ULTRA"|"STTITEN IP TV"|g' "$f" 2>/dev/null
            sed -i 's|"Ultra"|"STTITEN IP TV"|g' "$f" 2>/dev/null
            
            # 4. حالات خاصة مع مسافات
            sed -i 's|" ULTRA"|" STTITEN IP TV"|g' "$f" 2>/dev/null
            sed -i 's|"ULTRA "|"STTITEN IP TV "|g' "$f" 2>/dev/null
            
            # التحقق من التغيير
            if ! diff -q "$f.bak" "$f" > /dev/null 2>&1; then
              echo "✅ تم تعديل: $f"
              rm -f "$f.bak"
            else
              rm -f "$f.bak"
            fi
          done

      # ============================================================
      # 🔍 المرحلة 3: التحقق النهائي - هل بقي شيء؟
      # ============================================================
      - name: "Phase 3 - Verification (find remaining)"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🔍 التحقق النهائي: هل بقي ULTRA/UTV؟"
          echo "===================================================="
          
          REMAINING=$(find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            -not -path "*/build/*" 2>/dev/null | xargs grep -lE '"ULTRA TV"|"Ultra TV"|"TV ULTRA"|"UTV"|>ULTRA TV<|>UTV<' 2>/dev/null | head -20)
          
          if [ -n "$REMAINING" ]; then
            echo "⚠️ ملفات لا تزال بها النص القديم:"
            echo "$REMAINING"
            echo ""
            echo "===== التفاصيل ====="
            echo "$REMAINING" | while read f; do
              grep -nE '"ULTRA TV"|"Ultra TV"|"UTV"' "$f" | head -3
            done
          else
            echo "✅ لا يوجد أي نص قديم في ملفات .kt/.java/.xml"
          fi

      # ============================================================
      # 🎯 المرحلة 4: فحص خاص لملفات TopBar المعروفة
      # ============================================================
      - name: "Phase 4 - Special check for known TopBar files"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🎯 فحص الملفات المشتبه بها في الشريط العلوي"
          echo "===================================================="
          
          # الملفات المشتبه بها
          for f in \
            "app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/mobile/MobileHome.kt" \
            "app/src/main/kotlin/com/ultratv/tv/nativeapp/i18n/Strings.kt" \
            "app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"; do
            
            if [ -f "$f" ]; then
              echo ""
              echo "--- $f ---"
              grep -nE 'ULTRA|UTV|STTITEN|Text\("' "$f" | head -10 || echo "(لا يوجد)"
            fi
          done
          
          echo ""
          echo "===== البحث عن LogoMark ====="
          find . -name "*.kt" -not -path "*/build/*" | xargs grep -l "LogoMark" 2>/dev/null | head -5

      # ============================================================
      # 5. اسم التطبيق والمطور في strings.xml
      # ============================================================
      - name: Change app name in strings.xml
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅ تم"

      # ============================================================
      # 6. دمج المعماريتين
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
            fi
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 7. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      # ============================================================
      # 8. فحص APK النهائي للتأكد
      # ============================================================
      - name: Verify APK contents
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;
          
          APK=$(find . -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            echo ""
            echo "===== هل يحتوي APK على النص القديم؟ ====="
            unzip -p "$APK" resources.arsc 2>/dev/null | strings | grep -E "ULTRA TV|Ultra TV|UTV" | head -5 || echo "✅ لا يوجد نص قديم في الموارد"
            
            echo ""
            echo "===== هل يحتوي على STTITEN IP TV؟ ====="
            unzip -p "$APK" resources.arsc 2>/dev/null | strings | grep "STTITEN" | head -5 || echo "⚠️ لم يُعثر على STTITEN"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
