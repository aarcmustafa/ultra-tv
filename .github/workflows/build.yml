name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-icons-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-icons-

      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
          done
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "done"

      - name: Fix TopBar text
        working-directory: source/android-native
        run: |
          T="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$T" ]; then
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$T"
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$T"
          fi

      - name: Global replace in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "done"

      - name: Generate STTITEN icons for ALL folders
        working-directory: source/android-native
        run: |
          RES="app/src/main/res"
          mkdir -p "$RES/drawable-nodpi"
          
          # Logo الأفقي
          convert -size 1200x400 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 -fill "#FFFFFF" \
            -gravity center -annotate +0+0 "STTITEN IP TV" \
            "$RES/drawable-nodpi/sttiten_logo.png"
          
          # الأيقونة الرئيسية
          convert -size 512x512 xc:"#0E1116" \
            -font DejaVu-Sans-Bold \
            -pointsize 90 -fill "#FF3A2F" \
            -gravity center -annotate +0-60 "STTITEN" \
            -pointsize 55 -fill "#FFFFFF" \
            -annotate +0+60 "IP TV" \
            "$RES/drawable-nodpi/sttiten_icon.png"
          
          # أيقونة لكل كثافة
          for D in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            N="${D%%:*}"; S="${D##*:}"
            
            # Icon
            convert -size ${S}x${S} xc:"#0E1116" \
              -font DejaVu-Sans-Bold \
              -pointsize $((S*18/100)) -fill "#FF3A2F" \
              -gravity center -annotate +0-$((S*8/100)) "STT" \
              -pointsize $((S*12/100)) -fill "#FFFFFF" \
              -annotate +0+$((S*10/100)) "IP TV" \
              "/tmp/icon_${S}.png"
            
            # نضعها في mipmap-*
            M="$RES/mipmap-$N"
            mkdir -p "$M"
            cp "/tmp/icon_${S}.png" "$M/ic_launcher.png"
            cp "/tmp/icon_${S}.png" "$M/ic_launcher_round.png"
            cp "/tmp/icon_${S}.png" "$M/ic_launcher_foreground.png"
            
            # نضعها في drawable-port-* و drawable-land-*
            for DIR in "$RES/drawable-port-$N" "$RES/drawable-land-$N"; do
              mkdir -p "$DIR"
              find "$DIR" -name "*.png" 2>/dev/null | while read P; do
                cp "/tmp/icon_${S}.png" "$P"
              done
              cp "/tmp/icon_${S}.png" "$DIR/ic_launcher.png" 2>/dev/null || true
            done
            
            echo "  $N ($S): done"
          done
          
          # استبدال أي PNG آخر في mipmap-* و drawable-*
          find "$RES" -name "*.png" \( -path "*/mipmap-*" -o -path "*/drawable-port-*" -o -path "*/drawable-land-*" \) 2>/dev/null | while read P; do
            D=$(basename $(dirname "$P"))
            case "$D" in
              *mdpi) S=48 ;;
              *hdpi) S=72 ;;
              *xhdpi) S=96 ;;
              *xxhdpi) S=144 ;;
              *xxxhdpi) S=192 ;;
              *) S=96 ;;
            esac
            cp "/tmp/icon_${S}.png" "$P"
          done
          
          echo "All icons generated"
          ls -la "$RES/mipmap-xxxhdpi/" | head -10

      - name: Replace XML logos in drawable folders
        working-directory: source/android-native
        run: |
          for DIR in app/src/main/res/drawable*; do
            case "$DIR" in *nodpi*) continue ;; esac
            [ -d "$DIR" ] || continue
            for F in "$DIR"/*.xml; do
              [ -f "$F" ] || continue
              BN=$(basename "$F")
              case "$BN" in
                ic_opensubtitles_logo.xml|ic_tmdb_logo.xml) continue ;;
                *background*|*_bg*) continue ;;
              esac
              if grep -qE "<vector|<shape|<layer-list" "$F" 2>/dev/null; then
                if echo "$BN" | grep -qiE "launcher|icon"; then IMG="sttiten_icon"; else IMG="sttiten_logo"; fi
                cat > "$F" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/$IMG"
              android:gravity="center" />
          XMLEOF
              fi
            done
          done
          if [ -d "app/src/main/res/mipmap-anydpi-v26" ]; then
            for F in app/src/main/res/mipmap-anydpi-v26/*.xml; do
              [ -f "$F" ] || continue
              BN=$(basename "$F")
              [ "$BN" = "ic_launcher_round.xml" ] && continue
              cat > "$F" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/sttiten_background" />
              <foreground android:drawable="@drawable/sttiten_icon" />
          </adaptive-icon>
          XMLEOF
            done
          fi
          echo "XML replaced"

      - name: Add color resource
        working-directory: source/android-native
        run: |
          C="app/src/main/res/values/colors.xml"
          if [ ! -f "$C" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n' > "$C"
          fi
          if ! grep -q "sttiten_background" "$C"; then
            sed -i 's|</resources>|    <color name="sttiten_background">#0E1116</color>\n</resources>|' "$C"
          fi
          echo "color added"
          
