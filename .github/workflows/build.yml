name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-final-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-final-

      # ============================================================
      # 1. تغيير اسم التطبيق (UTV → STTITEN IP TV)
      # ============================================================
      - name: Change app name in strings.xml
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            # تغيير اسم التطبيق الرئيسي
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            # استبدال قيم أخرى
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djelloubi Mustafa</string>
          </resources>
          EOF
          
          echo "===== التحقق ====="
          grep -n 'name="app_name"' app/src/main/res/values/strings.xml

      # ============================================================
      # 2. 🔥 استبدال "ULTRA TV" في CloudPairingDialog.kt (المسؤول عن الشريط العلوي)
      # ============================================================
      - name: Replace ULTRA TV in CloudPairingDialog
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          if [ -f "$TARGET" ]; then
            echo "===== قبل التعديل ====="
            grep -n "ULTRA\|Ultra" "$TARGET"
            
            # استبدال النص الحرفي فقط داخل Text()
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"ULTRA"|"STTITEN"|g' "$TARGET"
            
            echo ""
            echo "===== بعد التعديل ====="
            grep -n "STTITEN\|ULTRA\|Ultra" "$TARGET"
          else
            echo "⚠️ لم يتم العثور على الملف"
          fi

      # ============================================================
      # 3. استبدال شامل لأي "ULTRA TV" آخر
      # ============================================================
      - name: Replace brand everywhere in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
          done
          
          echo "===== التحقق من النصوص المتبقية ====="
          grep -rn '"ULTRA TV"\|"Ultra TV"\|"TV ULTRA"' --include="*.kt" . 2>/dev/null | head -5 || echo "لا شيء ✅"
          
          echo ""
          echo "===== ما تم تعديله ====="
          grep -rn '"STTITEN IP TV"' --include="*.kt" . 2>/dev/null | head -5

      # ============================================================
      # 4. إنشاء شعارات PNG جديدة
      # ============================================================
      - name: Create logo PNGs
        working-directory: source/android-native
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          
          convert -size 1200x400 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          convert -size 512x512 xc:"#0E1116" \
            -font DejaVu-Sans-Bold -pointsize 70 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN\nIP TV" \
            app/src/main/res/drawable-nodpi/sttiten_icon.png
          
          ls -la app/src/main/res/drawable-nodpi/

      # ============================================================
      # 5. استبدال ملفات XML (بدون لمس banner)
      # ============================================================
      - name: Replace XML logo files
        working-directory: source/android-native
        run: |
          find app/src/main/res/drawable -name "*.xml" | while read f; do
            FILENAME=$(basename "$f")
            
            if echo "$FILENAME" | grep -qiE "banner|telegram"; then
              echo "⏭️ تخطي: $FILENAME"
              continue
            fi
            
            if grep -qE "<vector|<shape|<layer-list" "$f" 2>/dev/null; then
              if echo "$FILENAME" | grep -qiE "launcher|icon"; then
                IMG="sttiten_icon"
              else
                IMG="sttiten_logo"
              fi
              
              cat > "$f" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/$IMG"
              android:gravity="center" />
          XMLEOF
            fi
          done
          
          find app/src/main/res/mipmap-anydpi-v26 -name "*.xml" 2>/dev/null | while read f; do
            FILENAME=$(basename "$f")
            if echo "$FILENAME" | grep -qi "banner"; then
              continue
            fi
            cat > "$f" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black" />
              <foreground android:drawable="@drawable/sttiten_icon" />
          </adaptive-icon>
          XMLEOF
          done
          
          echo "✅ تم استبدال ملفات XML"

      # ============================================================
      # 6. دمج المعماريتين
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
            fi
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 7. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show APK info
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
