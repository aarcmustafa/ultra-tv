name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      # 🔍 تشخيص: أين يوجد مشروع Gradle؟
      - name: Diagnostic - Find Gradle project
        working-directory: source
        run: |
          echo "===== محتويات الجذر ====="
          ls -la
          echo ""
          echo "===== البحث عن settings.gradle ====="
          find . -maxdepth 4 -name "settings.gradle*" -not -path "*/build/*" 2>/dev/null
          echo ""
          echo "===== البحث عن build.gradle في android-app ====="
          find android-app -maxdepth 3 -name "build.gradle*" -not -path "*/build/*" 2>/dev/null | head -20
          echo ""
          echo "===== البحث عن build.gradle في android-native ====="
          find android-native -maxdepth 3 -name "build.gradle*" -not -path "*/build/*" 2>/dev/null | head -20
          echo ""
          echo "===== ملفات XML في android-app/android-native ====="
          find android-app android-native -name "*.xml" \( -path "*/drawable/*" -o -path "*/mipmap*/*" \) 2>/dev/null | head -40

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-

      # 🔧 تحديد مجلد المشروع وإنشاء gradlew
      - name: Locate project and create gradlew
        id: project
        working-directory: source
        run: |
          # نبحث عن settings.gradle في أي مكان
          SETTINGS=$(find . -maxdepth 4 -name "settings.gradle*" -not -path "*/build/*" | head -1)
          
          if [ -z "$SETTINGS" ]; then
            echo "❌ لم يتم العثور على settings.gradle"
            find . -maxdepth 2 -type d
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "✅ مجلد المشروع: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          
          cd "$PROJECT_DIR"
          
          # التحقق من وجود gradlew
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew غير موجود، سيتم إنشاؤه..."
            gradle wrapper --gradle-version 8.11.1 || gradle wrapper
          fi
          
          chmod +x gradlew
          ls -la gradlew
          
          echo ""
          echo "===== محتويات مجلد المشروع ====="
          ls -la

      # 2. تغيير اسم التطبيق والمطور
      - name: Change app name and developer
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          
          find "$PROJECT_DIR" -name "strings.xml" -not -path "*/build/*" | while read f; do
            echo "--- $f ---"
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|<string name="app_name" translatable="false">[^<]*</string>|<string name="app_name" translatable="false">STTITEN IP TV</string>|g' "$f"
            if grep -q 'name="developer_name"' "$f"; then
              sed -i 's|<string name="developer_name">[^<]*</string>|<string name="developer_name">جلولي مصطفى</string>|g' "$f"
            fi
          done
          
          # إنشاء ملف عربي
          APP_RES_DIR=$(find "$PROJECT_DIR" -type d -name "res" -path "*app/src/main*" | head -1)
          if [ -n "$APP_RES_DIR" ]; then
            mkdir -p "$APP_RES_DIR/values-ar"
            cat > "$APP_RES_DIR/values-ar/strings.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          fi
          echo "✅ تم تغيير الاسم والمطور"

      # 3. إنشاء صور الشعار
      - name: Create logo images
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          APP_RES_DIR=$(find "$PROJECT_DIR" -type d -name "res" -path "*app/src/main*" | head -1)
          
          if [ -z "$APP_RES_DIR" ]; then
            APP_RES_DIR="$PROJECT_DIR/app/src/main/res"
          fi
          
          echo "مجلد الموارد: $APP_RES_DIR"
          mkdir -p "$APP_RES_DIR/drawable-nodpi"
          
          convert -size 1280x720 xc:"#0E1116" -font DejaVu-Sans-Bold -pointsize 120 -fill "#FFFFFF" -gravity center -annotate +0+0 "STTITEN IP TV" "$APP_RES_DIR/drawable-nodpi/sttiten_banner.png"
          convert -size 512x512 xc:"#0E1116" -font DejaVu-Sans-Bold -pointsize 90 -fill "#FFFFFF" -gravity center -annotate +0+0 "STTITEN" "$APP_RES_DIR/drawable-nodpi/sttiten_icon.png"
          convert -size 1080x1920 xc:"#0E1116" -font DejaVu-Sans-Bold -pointsize 100 -fill "#FFFFFF" -gravity center -annotate +0+0 "STTITEN IP TV" "$APP_RES_DIR/drawable-nodpi/sttiten_splash.png"
          
          ls -la "$APP_RES_DIR/drawable-nodpi/"

      # 4. 🔥 استبدال اسم التطبيق في ملفات XML للأيقونات
      - name: Replace app name in XML icon files
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          
          echo "===== البحث عن ملفات XML في مجلدات android-app/android-native ====="
          
          # نبحث في كل مجلدات المشروع
          find "$PROJECT_DIR" -type f -name "*.xml" \( -path "*/drawable/*" -o -path "*/mipmap*/*" \) -not -path "*/build/*" | while read f; do
            
            # هل يحتوي الملف على نص "Ultra" أو "UltraTV" أو "ultra_tv"؟
            if grep -qE ">Ultra|>UltraTV|>Ultra TV|ultra_tv|UltraTV<" "$f" 2>/dev/null; then
              echo "--- استبدال النص في: $f ---"
              sed -i 's|>UltraTV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>Ultra<|>STTITEN IP TV<|g' "$f"
              sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
              sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            fi
          done
          
          echo ""
          echo "===== البحث في ملفات Kotlin عن Ultra ====="
          find "$PROJECT_DIR" -name "*.kt" -not -path "*/build/*" | xargs grep -l '"Ultra' 2>/dev/null | head -20 | while read f; do
            echo "--- $f ---"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra"|"STTITEN IP TV"|g' "$f"
          done
          
          echo "✅ تم البحث والاستبدال"

      # 5. تعديل ملفات XML للأيقونات لتشير إلى الصور الجديدة
      - name: Modify XML vector icons
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          
          find "$PROJECT_DIR" -type f -name "*.xml" \( -path "*/drawable/*" -o -path "*/mipmap-anydpi-v26/*" \) -not -path "*/build/*" | while read f; do
            if echo "$f" | grep -qiE "launcher|banner|splash|ic_"; then
              # فقط الملفات التي تحتوي على vector أو shape
              if grep -qE "<vector|<shape|<layer-list" "$f" 2>/dev/null; then
                echo "--- تعديل: $f ---"
                if echo "$f" | grep -qi "banner"; then IMG="sttiten_banner"
                elif echo "$f" | grep -qi "splash"; then IMG="sttiten_splash"
                else IMG="sttiten_icon"; fi
                
                cat > "$f" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/$IMG"
              android:gravity="center" />
          XMLEOF
              fi
            fi
          done
          echo "✅ تم تعديل ملفات XML"

      # 6. تبعيات QR
      - name: Add QR Code dependencies
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          BUILD_GRADLE=$(find "$PROJECT_DIR" -maxdepth 4 -name "build.gradle.kts" -path "*app*" -not -path "*/build/*" | head -1)
          
          if [ -z "$BUILD_GRADLE" ]; then
            BUILD_GRADLE=$(find "$PROJECT_DIR" -maxdepth 4 -name "build.gradle.kts" -not -path "*/build/*" | head -1)
          fi
          
          echo "ملف البناء: $BUILD_GRADLE"
          
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q 'qrose' "$BUILD_GRADLE"; then
              sed -i 's|dependencies {|dependencies {\n    implementation("io.github.alexzhirkevich:qrose:1.1.2")\n    implementation("org.nanohttpd:nanohttpd:2.3.1")|' "$BUILD_GRADLE"
            fi
            echo "✅ تم إضافة تبعيات QR"
          else
            echo "⚠️ لم يتم العثور على ملف البناء"
          fi

      # 7. إنشاء ملفات QR
      - name: Create QR files
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          PKG_ROOT=$(find "$PROJECT_DIR" -type d -name "java" -path "*app/src/main*" | head -1)
          
          if [ -z "$PKG_ROOT" ]; then
            PKG_ROOT="$PROJECT_DIR/app/src/main/java"
          fi
          
          echo "مجلد الكود: $PKG_ROOT"
          mkdir -p "$PKG_ROOT/com/ultratv/qr"
          
          # ملف الخادم
          cat > "$PKG_ROOT/com/ultratv/qr/QRConfigServer.kt" << 'KOTLIN_EOF'
          package com.ultratv.qr

          import android.content.Context
          import fi.iki.elonen.NanoHTTPD
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow

          data class ProviderConfig(
              val type: String,
              val serverUrl: String = "",
              val username: String = "",
              val password: String = "",
              val m3uUrl: String = ""
          )

          class QRConfigServer(context: Context, port: Int = 8765) : NanoHTTPD(port) {
              private val _receivedConfig = MutableStateFlow<ProviderConfig?>(null)
              val receivedConfig: StateFlow<ProviderConfig?> = _receivedConfig

              override fun serve(session: IHTTPSession): Response {
                  return when (session.uri) {
                      "/" -> serveConfigPage()
                      "/submit" -> handleSubmit(session)
                      else -> newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not Found")
                  }
              }

              private fun serveConfigPage(): Response {
                  val html = """
                      <!DOCTYPE html>
                      <html dir="rtl" lang="ar">
                      <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
                      <title>STTITEN IP TV</title>
                      <style>
                      body{font-family:Arial;max-width:500px;margin:20px auto;padding:20px;background:#0E1116;color:#FFF}
                      h1{color:#FF3A2F;text-align:center}
                      label{display:block;margin-top:15px;font-weight:bold}
                      input,select{width:100%;padding:12px;margin-top:5px;border-radius:8px;border:1px solid #333;background:#1A1D23;color:#FFF;box-sizing:border-box}
                      button{width:100%;padding:15px;margin-top:20px;background:#FF3A2F;color:#FFF;border:none;border-radius:8px;font-size:16px;cursor:pointer}
                      .hidden{display:none}
                      </style></head>
                      <body>
                      <h1>STTITEN IP TV</h1>
                      <form action="/submit" method="POST">
                      <label>نوع المصدر:</label>
                      <select name="type" onchange="toggleFields()" id="typeSelect">
                      <option value="xtream">Xtream Codes</option>
                      <option value="m3u">رابط M3U</option>
                      </select>
                      <div id="xtreamFields">
                      <label>عنوان السيرفر:</label><input type="text" name="serverUrl" placeholder="http://example.com:8080">
                      <label>اسم المستخدم:</label><input type="text" name="username">
                      <label>كلمة المرور:</label><input type="password" name="password">
                      </div>
                      <div id="m3uFields" class="hidden">
                      <label>رابط M3U:</label><input type="text" name="m3uUrl">
                      </div>
                      <button type="submit">إرسال</button>
                      </form>
                      <script>
                      function toggleFields(){var t=document.getElementById('typeSelect').value;
                      document.getElementById('xtreamFields').classList.toggle('hidden',t!=='xtream');
                      document.getElementById('m3uFields').classList.toggle('hidden',t!=='m3u');}
                      </script></body></html>
                  """.trimIndent()
                  return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html)
              }

              private fun handleSubmit(session: IHTTPSession): Response {
                  val files = HashMap<String, String>()
                  session.parseBody(files)
                  val params = session.parameters
                  val type = params["type"]?.firstOrNull() ?: ""
                  val config = if (type == "xtream") {
                      ProviderConfig("xtream", params["serverUrl"]?.firstOrNull() ?: "", params["username"]?.firstOrNull() ?: "", params["password"]?.firstOrNull() ?: "")
                  } else {
                      ProviderConfig("m3u", m3uUrl = params["m3uUrl"]?.firstOrNull() ?: "")
                  }
                  _receivedConfig.value = config
                  return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", "<h1 style='text-align:center;color:green;'>✅ تم!</h1>")
              }

              fun getLocalIpAddress(): String {
                  val interfaces = java.net.NetworkInterface.getNetworkInterfaces()
                  for (intf in interfaces) {
                      for (addr in intf.inetAddresses) {
                          if (!addr.isLoopbackAddress && addr is java.net.Inet4Address) return addr.hostAddress ?: "0.0.0.0"
                      }
                  }
                  return "0.0.0.0"
              }
          }
          KOTLIN_EOF

          cat > "$PKG_ROOT/com/ultratv/qr/QRConfigScreen.kt" << 'KOTLIN_EOF'
          package com.ultratv.qr

          import androidx.compose.foundation.Image
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import io.github.alexzhirkevich.qrose.rememberQrCodePainter

          @Composable
          fun QRConfigScreen(
              server: QRConfigServer,
              onConfigReceived: (ProviderConfig) -> Unit
          ) {
              val ipAddress by remember { mutableStateOf(server.getLocalIpAddress()) }
              val url = "http://$ipAddress:8765"
              val config by server.receivedConfig.collectAsState()

              LaunchedEffect(config) {
                  config?.let {
                      onConfigReceived(it)
                      server.receivedConfig.value = null
                  }
              }

              Column(
                  modifier = Modifier.fillMaxSize().padding(32.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("STTITEN IP TV", color = Color(0xFFFF3A2F), fontSize = 32.sp)
                  Spacer(Modifier.height(16.dp))
                  Text("امسح رمز QR بهاتفك لإضافة مصدر", fontSize = 20.sp, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(24.dp))
                  val painter = rememberQrCodePainter(url)
                  Image(painter = painter, contentDescription = "QR Code", modifier = Modifier.size(300.dp))
                  Spacer(Modifier.height(16.dp))
                  Text(url, fontSize = 16.sp, color = Color.Gray)
                  Spacer(Modifier.height(24.dp))
                  Text("انتظر حتى يتم استلام البيانات...", fontSize = 16.sp, color = Color.Gray)
              }
          }
          KOTLIN_EOF
          
          echo "✅ تم إنشاء ملفات QR"

      # 8. إعدادات Gradle
      - name: Setup Gradle properties
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      # 9. البناء
      - name: Build APK
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: List APKs
        working-directory: source
        run: find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-APK
          path: 'source/**/*.apk'
          if-no-files-found: error
