name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-ext2-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-ext2-

      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "done"

      - name: Fix TopBar text
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$TARGET" ]; then
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
          fi

      - name: Global replace in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "done"

      # ============================================================
      # 1. إنشاء StreamPref مع getSuffix()
      # ============================================================
      - name: Create StreamPref helper
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          mkdir -p "$PKG"
          cat > "$PKG/StreamPref.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.content.Context
          object StreamPref {
              private const val PREFS = "sttiten_ext"
              private const val KEY = "stream_ext"
              private const val DEFAULT = "m3u8"
              @Volatile private var appCtx: Context? = null
              @Volatile private var cached: String? = null
              fun init(context: Context) {
                  if (appCtx == null) {
                      appCtx = context.applicationContext
                  }
              }
              fun getExt(): String {
                  cached?.let { return it }
                  val c = appCtx ?: return DEFAULT
                  val v = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, DEFAULT) ?: DEFAULT
                  cached = v
                  return v
              }
              fun getSuffix(): String {
                  val ext = getExt()
                  return if (ext.isEmpty()) "" else ".$ext"
              }
              fun setExt(ext: String) {
                  cached = ext
                  val c = appCtx ?: return
                  c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY, ext).apply()
              }
          }
          KOTLIN_EOF
          echo "StreamPref created"

      # ============================================================
      # 2. ContentProvider للتهيئة التلقائية
      # ============================================================
      - name: Create StreamPrefInitProvider
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          cat > "$PKG/StreamPrefInitProvider.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.database.Cursor
          import android.net.Uri
          class StreamPrefInitProvider : ContentProvider() {
              override fun onCreate(): Boolean {
                  context?.let { StreamPref.init(it) }
                  return true
              }
              override fun query(uri: Uri, projection: Array<out String>?, selection: String?, selectionArgs: Array<out String>?, sortOrder: String?): Cursor? = null
              override fun getType(uri: Uri): String? = null
              override fun insert(uri: Uri, values: ContentValues?): Uri? = null
              override fun delete(uri: Uri, selection: String?, selectionArgs: Array<out String>?): Int = 0
              override fun update(uri: Uri, values: ContentValues?, selection: String?, selectionArgs: Array<out String>?): Int = 0
          }
          KOTLIN_EOF
          echo "StreamPrefInitProvider created"

      # ============================================================
      # 3. شاشة الإعدادات
      # ============================================================
      - name: Create StreamSettingsActivity
        working-directory: source/android-native
        run: |
          PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/ext"
          cat > "$PKG/StreamSettingsActivity.kt" << 'KOTLIN_EOF'
          package com.ultratv.tv.nativeapp.ext
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          class StreamSettingsActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  StreamPref.init(this)
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0E1116")) }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(60, 60, 60, 60)
                  }
                  scroll.addView(layout)
                  layout.addView(TextView(this).apply {
                      text = "STTITEN IP TV"
                      setTextColor(Color.parseColor("#FF3A2F"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 42f)
                      gravity = Gravity.CENTER
                  })
                  layout.addView(TextView(this).apply {
                      text = "إعدادات امتداد البث المباشر"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 10)
                  })
                  layout.addView(TextView(this).apply {
                      text = "إذا لم تعمل القنوات، جرب امتداداً مختلفاً"
                      setTextColor(Color.parseColor("#888888"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  })
                  val current = StreamPref.getExt()
                  val options = listOf(
                      "m3u8" to "m3u8  (موصى به)",
                      "ts" to "ts  (تقليدي)",
                      "m3u" to "m3u",
                      "" to "بدون امتداد"
                  )
                  for ((value, label) in options) {
                      val isCurrent = (value == current)
                      layout.addView(Button(this).apply {
                          text = if (isCurrent) "✓  $label" else label
                          setTextColor(Color.WHITE)
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                          setBackgroundColor(
                              if (isCurrent) Color.parseColor("#FF3A2F")
                              else Color.parseColor("#1A1D23")
                          )
                          setPadding(40, 30, 40, 30)
                          setOnClickListener {
                              StreamPref.setExt(value)
                              recreate()
                          }
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = 15 }
                      })
                  }
                  layout.addView(TextView(this).apply {
                      text = "الإعداد الحالي: $current"
                      setTextColor(Color.parseColor("#FF3A2F"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                      gravity = Gravity.CENTER
                      setPadding(0, 40, 0, 0)
                  })
                  setContentView(scroll)
              }
          }
          KOTLIN_EOF
          echo "StreamSettingsActivity created"

      # ============================================================
      # 4. تسجيل Provider و Activity في المانيفست
      # ============================================================
      - name: Register in Manifest
        working-directory: source/android-native
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # تسجيل Provider للتهيئة
            if ! grep -q "StreamPrefInitProvider" "$MANIFEST"; then
              perl -i -pe 's|(</application>)|    <provider\n        android:name="com.ultratv.tv.nativeapp.ext.StreamPrefInitProvider"\n        android:authorities="com.ultratv.tv.nativeapp.streampref"\n        android:exported="false" />\n    <activity\n        android:name="com.ultratv.tv.nativeapp.ext.StreamSettingsActivity"\n        android:exported="true"\n        android:label="STTITEN Settings">\n        <intent-filter>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>\n    </activity>\n$1|' "$MANIFEST"
            fi
          fi
          echo "manifest updated"
          grep -A 3 "StreamPrefInitProvider\|StreamSettingsActivity" "$MANIFEST" | head -20

      # ============================================================
      # 5. 🔥 التعديل الحاسم في XtreamClient.kt
      # ============================================================
      - name: Patch XtreamClient - apply extension from StreamPref
        working-directory: source/android-native
        run: |
          XTREAM="app/src/main/kotlin/com/ultratv/tv/nativeapp/data/xtream/XtreamClient.kt"
          if [ ! -f "$XTREAM" ]; then
            echo "ERROR: XtreamClient.kt not found"
            exit 1
          fi
          
          echo "===== قبل التعديل ====="
          grep -n '\$sid\.ts\|pathPrefix(p, "live")' "$XTREAM"
          
          # استبدال السطر الحاسم
          # قبل: val url = "${pathPrefix(p, "live")}$sid.ts"
          # بعد: val url = "${pathPrefix(p, "live")}$sid${com.ultratv.tv.nativeapp.ext.StreamPref.getSuffix()}"
          sed -i 's|pathPrefix(p, "live")}\$sid\.ts"|pathPrefix(p, "live")}\$sid${com.ultratv.tv.nativeapp.ext.StreamPref.getSuffix()}"|g' "$XTREAM"
          
          echo ""
          echo "===== بعد التعديل ====="
          grep -n 'StreamPref.getSuffix\|pathPrefix(p, "live")' "$XTREAM"
          
          # التحقق
          if grep -q "StreamPref.getSuffix" "$XTREAM"; then
            echo "SUCCESS: patch applied"
          else
            echo "FAILED: patch not applied, trying alternative"
            # طريقة بديلة
            perl -i -pe 's/\$sid\.ts"/\$sid\${com.ultratv.tv.nativeapp.ext.StreamPref.getSuffix()}"/g' "$XTREAM"
            grep -n 'StreamPref.getSuffix' "$XTREAM"
          fi

      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          A="app/build.gradle.kts"
          if [ -f "$A" ]; then
            if ! grep -q 'abiFilters' "$A"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$A"
            fi
            if ! grep -q 'useLegacyPackaging' "$A"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$A"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Ext
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
