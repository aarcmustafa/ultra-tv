name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-mipmap-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-mipmap-

      # ============================================================
      # 1. تشخيص: عرض كل ملفات mipmap
      # ============================================================
      - name: Diagnostic - List mipmap files
        working-directory: source/android-native/app/src/main/res
        run: |
          echo "===== محتويات mipmap-mdpi ====="
          ls -la mipmap-mdpi/ 2>/dev/null || echo "غير موجود"
          echo ""
          echo "===== محتويات mipmap-hdpi ====="
          ls -la mipmap-hdpi/ 2>/dev/null || echo "غير موجود"
          echo ""
          echo "===== محتويات mipmap-xhdpi ====="
          ls -la mipmap-xhdpi/ 2>/dev/null || echo "غير موجود"
          echo ""
          echo "===== محتويات mipmap-xxhdpi ====="
          ls -la mipmap-xxhdpi/ 2>/dev/null || echo "غير موجود"
          echo ""
          echo "===== محتويات mipmap-xxxhdpi ====="
          ls -la mipmap-xxxhdpi/ 2>/dev/null || echo "غير موجود"
          echo ""
          echo "===== محتويات mipmap-anydpi-v26 ====="
          ls -la mipmap-anydpi-v26/ 2>/dev/null || echo "غير موجود"
          
          echo ""
          echo "===== محتوى ملفات XML في mipmap-anydpi-v26 ====="
          for f in mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo ""
          done

      # ============================================================
      # 2. تغيير اسم التطبيق والمطور
      # ============================================================
      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅ تم تغيير الاسم"

      # ============================================================
      # 3. استبدال النصوص في Kotlin
      # ============================================================
      - name: Replace brand in Kotlin files
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅ تم"

      # ============================================================
      # 4. 🔥 إنشاء صور جديدة لمجلدات mipmap
      # ============================================================
      - name: Generate new icon PNGs for each mipmap density
        working-directory: source/android-native/app/src/main/res
        run: |
          # الألوان
          BG="#0E1116"
          FG="#FFFFFF"
          ACCENT="#FF3A2F"
          
          # ============================================
          # mipmap-mdpi → 48×48
          # ============================================
          echo "===== mipmap-mdpi (48×48) ====="
          mkdir -p mipmap-mdpi
          convert -size 48x48 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 24 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "S" \
            mipmap-mdpi/ic_launcher.png
          
          convert -size 48x48 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 24 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "S" \
            mipmap-mdpi/ic_launcher_round.png 2>/dev/null || true
          
          # ============================================
          # mipmap-hdpi → 72×72
          # ============================================
          echo "===== mipmap-hdpi (72×72) ====="
          mkdir -p mipmap-hdpi
          convert -size 72x72 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 32 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "ST" \
            mipmap-hdpi/ic_launcher.png
          
          convert -size 72x72 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 32 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "ST" \
            mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
          
          # ============================================
          # mipmap-xhdpi → 96×96
          # ============================================
          echo "===== mipmap-xhdpi (96×96) ====="
          mkdir -p mipmap-xhdpi
          convert -size 96x96 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 42 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xhdpi/ic_launcher.png
          
          convert -size 96x96 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 42 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xhdpi/ic_launcher_round.png 2>/dev/null || true
          
          # ============================================
          # mipmap-xxhdpi → 144×144
          # ============================================
          echo "===== mipmap-xxhdpi (144×144) ====="
          mkdir -p mipmap-xxhdpi
          convert -size 144x144 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 60 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xxhdpi/ic_launcher.png
          
          convert -size 144x144 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 60 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
          
          # ============================================
          # mipmap-xxxhdpi → 192×192
          # ============================================
          echo "===== mipmap-xxxhdpi (192×192) ====="
          mkdir -p mipmap-xxxhdpi
          convert -size 192x192 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 80 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xxxhdpi/ic_launcher.png
          
          convert -size 192x192 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 80 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STT" \
            mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true
          
          # ============================================
          # إنشاء نسخة كبيرة من الشعار في drawable-nodpi
          # ============================================
          echo "===== drawable-nodpi (شعار كامل) ====="
          mkdir -p drawable-nodpi
          
          # شعار أفقي كامل
          convert -size 1280x400 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 120 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            drawable-nodpi/sttiten_full_logo.png
          
          # شعار مربع بجودة عالية
          convert -size 512x512 xc:"$BG" \
            -font DejaVu-Sans-Bold -pointsize 90 \
            -fill "$FG" -gravity center \
            -annotate +0+0 "STTITEN" \
            -pointsize 50 -annotate +0+80 "IP TV" \
            drawable-nodpi/sttiten_icon.png
          
          echo ""
          echo "===== جميع الصور التي تم إنشاؤها ====="
          find . -name "*.png" -newer /tmp -mmin -2 2>/dev/null | head -30
          ls -la mipmap-mdpi/ mipmap-hdpi/ mipmap-xhdpi/ mipmap-xxhdpi/ mipmap-xxxhdpi/

      # ============================================================
      # 5. 🔥 تعديل ملفات XML في mipmap-anydpi-v26 للربط بالأيقونات الجديدة
      # ============================================================
      - name: Update adaptive icons in mipmap-anydpi-v26
        working-directory: source/android-native/app/src/main/res
        run: |
          echo "===== قبل التعديل ====="
          for f in mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo ""
          done
          
          echo "===== استبدال محتوى XML ====="
          for f in mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            
            # تخطي أي ملف banner
            if echo "$FILENAME" | grep -qi "banner"; then
              echo "⏭️ تخطي: $FILENAME"
              continue
            fi
            
            echo "✅ تعديل: $FILENAME"
            cat > "$f" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XMLEOF
          done
          
          # إنشاء ic_launcher_foreground.png في mipmap-xxxhdpi
          convert -size 432x432 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 90 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN" \
            -pointsize 50 -annotate +0+80 "IP TV" \
            mipmap-xxxhdpi/ic_launcher_foreground.png
          
          echo ""
          echo "===== التحقق النهائي ====="
          for f in mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            head -5 "$f"
          done

      # ============================================================
      # 6. إضافة لون الخلفية للأيقونة التكيفية
      # ============================================================
      - name: Add ic_launcher_background color
        working-directory: source/android-native/app/src/main/res
        run: |
          mkdir -p values
          COLORS_FILE="values/colors.xml"
          
          if [ ! -f "$COLORS_FILE" ]; then
            cat > "$COLORS_FILE" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          </resources>
          EOF
          fi
          
          # إضافة اللون إذا لم يكن موجوداً
          if ! grep -q "ic_launcher_background" "$COLORS_FILE"; then
            sed -i 's|</resources>|    <color name="ic_launcher_background">#0E1116</color>\n</resources>|' "$COLORS_FILE"
          fi
          
          echo "===== colors.xml ====="
          cat "$COLORS_FILE"

      # ============================================================
      # 7. دمج المعماريتين
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
            fi
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 8. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show result
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;
          
          echo ""
          echo "===== الأيقونات المُضمَّنة في APK ====="
          for apk in $(find . -name "*.apk" | head -1); do
            unzip -l "$apk" | grep -E "ic_launcher|sttiten" | head -20
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
