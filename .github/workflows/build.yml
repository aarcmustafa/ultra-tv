name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v2-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-v2-

      # 🔍 الخطوة الحاسمة: البحث الشامل عن Ultra TV
      - name: Diagnostic - Find all "Ultra TV" occurrences
        working-directory: source/android-native
        run: |
          echo "===== [1] في strings.xml ====="
          grep -rn "Ultra TV\|ULTRA TV\|TV ULTRA\|UltraTV\|ultra_tv" --include="strings.xml" . 2>/dev/null | head -30
          
          echo ""
          echo "===== [2] في ملفات Kotlin (نصوص حرفية) ====="
          grep -rn '"Ultra TV"\|"ULTRA TV"\|"TV ULTRA"\|"UltraTV"\|"ultra_tv"' --include="*.kt" . 2>/dev/null | head -40
          
          echo ""
          echo "===== [3] في ملفات XML الأخرى ====="
          grep -rn "Ultra TV\|ULTRA TV\|TV ULTRA" --include="*.xml" . 2>/dev/null | grep -v strings.xml | head -20

      # 🔥 استبدال شامل في كل مكان
      - name: Replace "Ultra TV" everywhere
        working-directory: source/android-native
        run: |
          echo "===== استبدال في strings.xml ====="
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|Ultra TV|STTITEN IP TV|g' "$f"
            sed -i 's|ULTRA TV|STTITEN IP TV|g' "$f"
            sed -i 's|TV ULTRA|STTITEN IP TV|g' "$f"
            sed -i 's|UltraTV|STTITEN IP TV|g' "$f"
          done
          
          echo "===== استبدال في ملفات Kotlin ====="
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV Ultra"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra Tv"|"STTITEN IP TV"|g' "$f"
          done
          
          echo "===== استبدال في ملفات XML ====="
          find . -name "*.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
          done
          
          echo "✅ تم الاستبدال الشامل"

      # تغيير اسم التطبيق في strings.xml
      - name: Change app_name
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
          done
          
          # ملف عربي
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
          </resources>
          EOF

      # ✅ التحقق: هل بقيت أي نصوص "Ultra"؟
      - name: Verify no Ultra TV remains
        working-directory: source/android-native
        run: |
          echo "===== البحث عن أي بقايا ====="
          REMAINING=$(grep -rn '"Ultra TV"\|"ULTRA TV"\|"TV ULTRA"\|"UltraTV"' --include="*.kt" . 2>/dev/null | wc -l)
          echo "عدد المراجع المتبقية في Kotlin: $REMAINING"
          
          grep -rn '"Ultra TV"\|"ULTRA TV"\|"TV ULTRA"' --include="*.kt" . 2>/dev/null | head -10 || echo "لا يوجد ✅"
          
          echo ""
          echo "===== أمثلة على النصوص المعدلة ====="
          grep -rn '"STTITEN IP TV"' --include="*.kt" . 2>/dev/null | head -10

      # إعدادات Gradle
      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-APK
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
