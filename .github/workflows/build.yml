name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-icons-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-icons-

      # ============================================================
      # 1. تشخيص: عرض كل ملفات XML Vector في drawable ومكتبات mipmap
      # ============================================================
      - name: Diagnostic - List all vector XML files
        working-directory: source/android-native/app/src/main/res
        run: |
          echo "===== كل ملفات XML في drawable ====="
          find drawable* -name "*.xml" -type f 2>/dev/null | sort
          
          echo ""
          echo "===== كل ملفات XML في mipmap-anydpi-v26 ====="
          find mipmap-anydpi-v26 -name "*.xml" -type f 2>/dev/null | sort
          
          echo ""
          echo "===== كل ملفات PNG (لن نلمسها) ====="
          find . -name "*.png" -type f 2>/dev/null | sort | head -30
          
          echo ""
          echo "===== ملفات XML التي تشير إلى vector/shape ====="
          for f in $(find drawable* mipmap-anydpi-v26 -name "*.xml" 2>/dev/null); do
            if grep -qE "<vector|<shape|<layer-list" "$f" 2>/dev/null; then
              echo "  $f"
            fi
          done

      # ============================================================
      # 2. تغيير اسم التطبيق في strings.xml
      # ============================================================
      - name: Change app name in strings.xml
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          
          echo "✅ تم تغيير الاسم"

      # ============================================================
      # 3. استبدال "ULTRA TV" في ملفات Kotlin
      # ============================================================
      - name: Replace brand in Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅ تم"

      # ============================================================
      # 4. 🔥 إنشاء صور PNG جديدة (لا نلمس الموجود)
      # ============================================================
      - name: Create new PNG logos
        working-directory: source/android-native/app/src/main/res
        run: |
          mkdir -p drawable-nodpi
          
          echo "===== إنشاء sttiten_logo.png (أفقي) ====="
          convert -size 1200x400 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            drawable-nodpi/sttiten_logo.png
          
          echo "===== إنشاء sttiten_icon.png (مربع) ====="
          convert -size 512x512 xc:"#0E1116" \
            -font DejaVu-Sans-Bold -pointsize 70 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN\nIP TV" \
            drawable-nodpi/sttiten_icon.png
          
          echo "===== إنشاء sttiten_banner_text.png (بانر نصي) ====="
          convert -size 320x180 xc:"#0E1116" \
            -font DejaVu-Sans-Bold -pointsize 36 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN" \
            -pointsize 22 -annotate +0+50 "IP TV" \
            drawable-nodpi/sttiten_banner_text.png
          
          echo ""
          echo "===== الصور الجديدة ====="
          ls -la drawable-nodpi/

      # ============================================================
      # 5. 🔥 استبدال ملفات XML للشعارات (مع الحفاظ على PNG الموجود)
      # ============================================================
      - name: Replace XML logo files (preserve banner.png)
        working-directory: source/android-native/app/src/main/res
        run: |
          echo "===== البدء في معالجة ملفات XML ====="
          
          # قائمة الملفات المستثناة (لا نلمسها)
          EXCLUDE="ic_opensubtitles_logo.xml ic_tmdb_logo.xml telegram_qr.xml"
          
          # نبحث في جميع مجلدات drawable
          for DIR in drawable drawable-v24 drawable-hdpi drawable-mdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            if [ ! -d "$DIR" ]; then continue; fi
            
            for f in "$DIR"/*.xml; do
              [ -f "$f" ] || continue
              FILENAME=$(basename "$f")
              
              # تخطي الملفات المستثناة
              if echo "$EXCLUDE" | grep -qw "$FILENAME"; then
                echo "⏭️ تخطي (خدمة): $FILENAME"
                continue
              fi
              
              # تخطي أي ملف له علاقة بـ banner (نحافظ على PNG)
              if echo "$FILENAME" | grep -qi "banner"; then
                echo "⏭️ تخطي (banner): $FILENAME"
                continue
              fi
              
              # هل الملف vector/shape/layer-list؟
              if grep -qE "<vector|<shape|<layer-list" "$f" 2>/dev/null; then
                # استثناء: إذا كان داخل layer-list (نحافظ على البنية)
                if grep -q "<layer-list" "$f"; then
                  echo "⏭️ تخطي (layer-list): $FILENAME"
                  continue
                fi
                
                echo "✅ استبدال: $FILENAME"
                
                # اختر الصورة المناسبة
                if echo "$FILENAME" | grep -qiE "ic_launcher|launcher"; then
                  IMG="sttiten_icon"
                elif echo "$FILENAME" | grep -qiE "splash"; then
                  IMG="sttiten_banner_text"
                else
                  IMG="sttiten_logo"
                fi
                
                cat > "$f" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/$IMG"
              android:gravity="center" />
          XMLEOF
              fi
            done
          done
          
          echo ""
          echo "===== معالجة mipmap-anydpi-v26 ====="
          for f in mipmap-anydpi-v26/*.xml; do
            [ -f "$f" ] || continue
            FILENAME=$(basename "$f")
            
            if echo "$FILENAME" | grep -qi "banner"; then
              echo "⏭️ تخطي: $FILENAME"
              continue
            fi
            
            echo "✅ تعديل أيقونة تكيفية: $FILENAME"
            cat > "$f" << XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black" />
              <foreground android:drawable="@drawable/sttiten_icon" />
          </adaptive-icon>
          XMLEOF
          done
          
          echo ""
          echo "===== التحقق النهائي ====="
          echo "--- ملفات XML المعدلة ---"
          for DIR in drawable*; do
            for f in "$DIR"/*.xml; do
              [ -f "$f" ] || continue
              if grep -q "sttiten_" "$f" 2>/dev/null; then
                echo "✅ $(basename $f)"
              fi
            done
          done

      # ============================================================
      # 6. دمج المعماريتين
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
            fi
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 7. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show result
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
