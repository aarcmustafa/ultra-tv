name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-split-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-split-

      # ============================================================
      # 🔍 الخطوة 1: تشخيص دقيق لنص الشريط العلوي
      # ============================================================
      - name: Diagnostic - Analyze TopBar text structure
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          echo "===================================================="
          echo "===== محتوى CloudPairingDialog.kt (الأسطر 60-100) ====="
          echo "===================================================="
          sed -n '60,100p' "$TARGET" 2>/dev/null || echo "الملف غير موجود"
          
          echo ""
          echo "===================================================="
          echo "===== هل النص مقسّم؟ ====="
          echo "===================================================="
          
          if grep -qE 'Text\("ULTRA"\)|Text\("ULTRA",' "$TARGET" 2>/dev/null; then
            echo "🔴 وجدت: Text(\"ULTRA\") منفصل"
          fi
          
          if grep -qE 'Text\("TV"\)|Text\("TV",' "$TARGET" 2>/dev/null; then
            echo "🔴 وجدت: Text(\"TV\") منفصل"
          fi
          
          if grep -qE '"ULTRA TV"|"Ultra TV"|"TV ULTRA"|"UTV"' "$TARGET" 2>/dev/null; then
            echo "🔴 وجدت: نص كامل في Text واحد"
          fi
          
          echo ""
          echo "===================================================="
          echo "===== كل الأسطر التي تحتوي ULTRA/TV/UTV في الملف ====="
          echo "===================================================="
          grep -nE '"ULTRA"|"TV"|"Ultra"|"UTV"' "$TARGET" 2>/dev/null | head -20

      # ============================================================
      # 2. تغيير اسم التطبيق والمطور
      # ============================================================
      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅ تم تغيير الاسم"

      # ============================================================
      # 3. 🔥 معالجة الشريط العلوي - تدعم الحالتين
      # ============================================================
      - name: Smart fix TopBar text (both cases)
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          if [ ! -f "$TARGET" ]; then
            echo "⚠️ الملف غير موجود: $TARGET"
            exit 0
          fi
          
          echo "===== قبل المعالجة ====="
          grep -nE 'Text\("(ULTRA|TV|Ultra|UTV)' "$TARGET" | head -10 || echo "لا توجد سطور مطابقة"
          
          # ============================================
          # الحالة 1: النص الكامل في Text واحد
          # ============================================
          if grep -qE '"ULTRA TV"|"Ultra TV"|"TV ULTRA"|"UTV"' "$TARGET"; then
            echo ""
            echo "🔵 الحالة 1 مكتشفة: نص كامل في Text واحد"
            
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            
            # إزالة letterSpacing الغريب
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
            sed -i 's|letterSpacing = TextUnit(1\.7f,.*Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
            
            echo "✅ تم استبدال النص الكامل + إزالة letterSpacing"
          fi
          
          # ============================================
          # الحالة 2: النص مقسّم (Text("ULTRA") + Text("TV"))
          # ============================================
          HAS_ULTRA=$(grep -cE 'Text\("ULTRA"\)|Text\("ULTRA",' "$TARGET" 2>/dev/null)
          HAS_TV=$(grep -cE 'Text\("TV"\)|Text\("TV",' "$TARGET" 2>/dev/null)
          
          if [ "$HAS_ULTRA" -gt 0 ] && [ "$HAS_TV" -gt 0 ]; then
            echo ""
            echo "🔵 الحالة 2 مكتشفة: النص مقسّم"
            echo "   عدد Text(\"ULTRA\"): $HAS_ULTRA"
            echo "   عدد Text(\"TV\"): $HAS_TV"
            
            # الاستراتيجية:
            # - نستبدل الأول بالاسم الكامل
            # - نستبدل الثاني بنص فارغ
            # - هذا يضمن عدم وجود تكرار
            
            # الاستبدال 1: Text("ULTRA") → Text("STTITEN IP TV")
            sed -i 's|Text("ULTRA")|Text("STTITEN IP TV")|g' "$TARGET"
            sed -i 's|Text("ULTRA",|Text("STTITEN IP TV",|g' "$TARGET"
            
            # الاستبدال 2: Text("TV") → Text("")
            sed -i 's|Text("TV")|Text("")|g' "$TARGET"
            sed -i 's|Text("TV",|Text("",|g' "$TARGET"
            
            echo "✅ تم استبدال النص المقسّم"
          fi
          
          # ============================================
          # الحالة 3: نص في متغير (val title = "ULTRA TV")
          # ============================================
          if grep -qE '=\s*"ULTRA TV"|=\s*"Ultra TV"' "$TARGET"; then
            echo ""
            echo "🔵 الحالة 3 مكتشفة: النص في متغير"
            sed -i 's|=\s*"ULTRA TV"|= "STTITEN IP TV"|g' "$TARGET"
            sed -i 's|=\s*"Ultra TV"|= "STTITEN IP TV"|g' "$TARGET"
            echo "✅ تم"
          fi
          
          # ============================================
          # الحالة 4: استبدال احتياطي شامل (أي "ULTRA" أو "TV" متبقي)
          # ============================================
          # في حالات نادرة، قد يكون النص في سطر واحد لكن بأشكال مختلفة
          # لا نستبدل كل "TV" لأن كلمة TV تظهر في كلمات أخرى مثل Live TV
          
          echo ""
          echo "===== بعد المعالجة ====="
          sed -n '60,100p' "$TARGET"

      # ============================================================
      # 4. استبدال احتياطي شامل في كل ملفات Kotlin
      # ============================================================
      - name: Global replace in all Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅ تم الاستبدال الشامل"

      # ============================================================
      # 5. دمج المعماريتين
      # ============================================================
      - name: Configure universal APK
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
            fi
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
            fi
          fi

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 6. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show APK
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
