name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v4-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-v4-

      - name: "Diagnostic - Find stream URL builder"
        working-directory: source/android-native
        run: |
          echo "===== ملفات Xtream/Streaming ====="
          find . -path "*xtream*" -name "*.kt" -not -path "*/build/*" -not -path "*/test/*" 2>/dev/null
          find . -path "*stream*" -name "*.kt" -not -path "*/build/*" -not -path "*/test/*" 2>/dev/null
          echo "===== الأسطر التي تحتوي .ts ====="
          grep -rn '\.ts"' --include="*.kt" . 2>/dev/null | grep -v "*/test/*" | head -20 || true
          echo "===== الأسطر التي تحتوي /live/ ====="
          grep -rn '/live/' --include="*.kt" . 2>/dev/null | grep -v "*/test/*" | head -20 || true

      - name: "Change app name and developer"
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅"

      - name: "Fix TopBar text"
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          if [ -f "$TARGET" ]; then
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
          fi

      - name: "Global replace in Kotlin"
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅"

      - name: "Fix stream URL extension (.ts → .m3u8)"
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" -not -path "*/test/*" | while read f; do
            if grep -qE '\.ts"|/live/' "$f" 2>/dev/null; then
              echo "--- تعديل: $f ---"
              sed -i 's|\.ts"|.m3u8"|g' "$f"
              sed -i "s|\.ts'|.m3u8'|g" "$f"
              sed -i 's|}\.ts|}.m3u8|g' "$f"
            fi
          done
          echo "===== التحقق ====="
          find . -name "*.kt" -not -path "*/build/*" -not -path "*/test/*" | xargs grep -l '\.ts"' 2>/dev/null | head -5 || echo "✅ لا يوجد .ts"

      # ⚠️ انتقل إلى الجزء الثاني بعد هذا السطر
      - name: "Add QR Code local pairing feature"
  working-directory: source/android-native
  run: |
    BUILD_GRADLE="app/build.gradle.kts"
    if [ -f "$BUILD_GRADLE" ]; then
      if ! grep -q 'zxing' "$BUILD_GRADLE"; then
        sed -i 's|dependencies {|dependencies {\n    implementation("com.google.zxing:core:3.5.3")\n    implementation("org.nanohttpd:nanohttpd:2.3.1")|' "$BUILD_GRADLE"
      fi
    fi
    PKG="app/src/main/kotlin/com/ultratv/tv/nativeapp/qr"
    mkdir -p "$PKG"
    cat > "$PKG/QRConfigServer.kt" << 'KOTLIN_EOF'
    package com.ultratv.tv.nativeapp.qr
    import android.content.Context
    import fi.iki.elonen.NanoHTTPD
    import java.net.Inet4Address
    import java.net.NetworkInterface
    class QRConfigServer(private val context: Context, port: Int = 8765) : NanoHTTPD(port) {
        override fun serve(session: IHTTPSession): Response {
            return when (session.uri) {
                "/" -> serveForm()
                "/submit" -> handleSubmit(session)
                else -> newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not found")
            }
        }
        private fun serveForm(): Response {
            val html = """
    <!DOCTYPE html>
    <html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>STTITEN IP TV</title>
    <style>body{font-family:Arial;max-width:480px;margin:20px auto;padding:20px;background:#0E1116;color:#FFF}h1{color:#FF3A2F;text-align:center}label{display:block;margin-top:15px;font-weight:bold}input,select{width:100%;padding:12px;margin-top:5px;border-radius:8px;border:1px solid #333;background:#1A1D23;color:#FFF;box-sizing:border-box}button{width:100%;padding:15px;margin-top:20px;background:#FF3A2F;color:#FFF;border:none;border-radius:8px;font-size:16px;cursor:pointer}.hidden{display:none}</style></head>
    <body><h1>STTITEN IP TV</h1>
    <form action="/submit" method="POST">
    <label>نوع المصدر:</label><select name="type" onchange="tf()" id="tsel"><option value="xtream">Xtream Codes</option><option value="m3u">رابط M3U / M3U8</option></select>
    <div id="xf"><label>عنوان السيرفر:</label><input type="text" name="serverUrl"><label>اسم المستخدم:</label><input type="text" name="username"><label>كلمة المرور:</label><input type="password" name="password"></div>
    <div id="mf" class="hidden"><label>رابط M3U / M3U8:</label><input type="text" name="m3uUrl"></div>
    <button type="submit">إرسال إلى التلفاز</button></form>
    <script>function tf(){var t=document.getElementById('tsel').value;document.getElementById('xf').classList.toggle('hidden',t!=='xtream');document.getElementById('mf').classList.toggle('hidden',t!=='m3u');}</script>
    </body></html>
            """.trimIndent()
            return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", html)
        }
        private fun handleSubmit(session: IHTTPSession): Response {
            val files = HashMap<String, String>()
            session.parseBody(files)
            val params = session.parameters
            val prefs = context.getSharedPreferences("sttiten_qr", Context.MODE_PRIVATE)
            val ed = prefs.edit()
            val type = params["type"]?.firstOrNull() ?: "xtream"
            ed.putString("type", type)
            if (type == "xtream") {
                ed.putString("serverUrl", params["serverUrl"]?.firstOrNull() ?: "")
                ed.putString("username", params["username"]?.firstOrNull() ?: "")
                ed.putString("password", params["password"]?.firstOrNull() ?: "")
            } else {
                ed.putString("m3uUrl", params["m3uUrl"]?.firstOrNull() ?: "")
            }
            ed.apply()
            return newFixedLengthResponse(Response.Status.OK, "text/html; charset=utf-8", "<h1 style='text-align:center;color:green;padding:40px;background:#0E1116;color:#FFF'>✅ تم</h1>")
        }
        fun getLocalIp(): String {
            val interfaces = NetworkInterface.getNetworkInterfaces()
            for (intf in interfaces) {
                for (addr in intf.inetAddresses) {
                    if (!addr.isLoopbackAddress && addr is Inet4Address) return addr.hostAddress ?: "0.0.0.0"
                }
            }
            return "0.0.0.0"
        }
    }
    KOTLIN_EOF
    cat > "$PKG/QRConfigActivity.kt" << 'KOTLIN_EOF'
    package com.ultratv.tv.nativeapp.qr
    import android.app.Activity
    import android.graphics.Bitmap
    import android.graphics.Color
    import android.os.Bundle
    import android.util.TypedValue
    import android.view.Gravity
    import android.widget.ImageView
    import android.widget.LinearLayout
    import android.widget.TextView
    import com.google.zxing.BarcodeFormat
    import com.google.zxing.EncodeHintType
    import com.google.zxing.qrcode.QRCodeWriter
    class QRConfigActivity : Activity() {
        private var server: QRConfigServer? = null
        override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            server = QRConfigServer(this)
            try { server?.start() } catch (e: Exception) { }
            val url = "http://" + (server?.getLocalIp() ?: "0.0.0.0") + ":8765"
            val layout = LinearLayout(this).apply {
                orientation = LinearLayout.VERTICAL
                gravity = Gravity.CENTER
                setBackgroundColor(Color.parseColor("#0E1116"))
                setPadding(40, 40, 40, 40)
            }
            layout.addView(TextView(this).apply { text = "STTITEN IP TV"; setTextColor(Color.parseColor("#FF3A2F")); setTextSize(TypedValue.COMPLEX_UNIT_SP, 36f) })
            layout.addView(TextView(this).apply { text = "امسح QR بهاتفك على نفس الشبكة"; setTextColor(Color.WHITE); setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f) })
            val hints = HashMap<EncodeHintType, Any>()
            hints[EncodeHintType.CHARACTER_SET] = "UTF-8"
            hints[EncodeHintType.MARGIN] = 1
            val m = QRCodeWriter().encode(url, BarcodeFormat.QR_CODE, 700, 700, hints)
            val bmp = Bitmap.createBitmap(700, 700, Bitmap.Config.ARGB_8888)
            for (x in 0 until 700) for (y in 0 until 700) bmp.setPixel(x, y, if (m.get(x, y)) Color.BLACK else Color.WHITE)
            layout.addView(ImageView(this).apply { setImageBitmap(bmp); layoutParams = LinearLayout.LayoutParams(700, 700).apply { topMargin = 40; bottomMargin = 40 } })
            layout.addView(TextView(this).apply { text = url; setTextColor(Color.GRAY); setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f) })
            setContentView(layout)
        }
        override fun onDestroy() { super.onDestroy(); try { server?.stop() } catch (e: Exception) { } }
    }
    KOTLIN_EOF
    echo "✅ تم إنشاء ملفات QR"

- name: "Register QR Activity in Manifest"
  working-directory: source/android-native
  run: |
    MANIFEST="app/src/main/AndroidManifest.xml"
    if [ -f "$MANIFEST" ]; then
      if ! grep -q "QRConfigActivity" "$MANIFEST"; then
        perl -i -pe 's|(</application>)|    <activity\n        android:name="com.ultratv.tv.nativeapp.qr.QRConfigActivity"\n        android:exported="true"\n        android:label="STTITEN QR Setup">\n        <intent-filter>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>\n    </activity>\n$1|' "$MANIFEST"
      fi
    fi

- name: "Configure universal APK"
  working-directory: source/android-native
  run: |
    APP_GRADLE="app/build.gradle.kts"
    if [ -f "$APP_GRADLE" ]; then
      if ! grep -q 'abiFilters' "$APP_GRADLE"; then
        perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
      fi
      if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
        perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
      fi
    fi

- name: "Setup Gradle properties"
  working-directory: source/android-native
  run: |
    echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
    echo "org.gradle.daemon=false" >> gradle.properties
    echo "org.gradle.parallel=false" >> gradle.properties
    echo "org.gradle.caching=true" >> gradle.properties
    echo "android.useAndroidX=true" >> gradle.properties
    echo "kotlin.code.style=official" >> gradle.properties

- name: "Grant execute permission"
  working-directory: source/android-native
  run: chmod +x gradlew

- name: "Build APK"
  working-directory: source/android-native
  run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

- name: "Show APK info"
  working-directory: source/android-native
  run: |
    find . -name "*.apk" -exec ls -lh {} \;

- name: "Upload APK"
  uses: actions/upload-artifact@v4
  with:
    name: STTITEN-IP-TV-Final
    path: 'source/android-native/**/*.apk'
    if-no-files-found: error
