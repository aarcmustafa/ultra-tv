name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-ua2-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-ua2-

      # ============================================================
      # 1. تشخيص - البحث عن User-Agent وملفات المشغل
      # ============================================================
      - name: "Diagnostic - Find User-Agent"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🔍 البحث عن User-Agent في الكود"
          echo "===================================================="
          grep -rn "UserAgent\|userAgent" --include="*.kt" . 2>/dev/null | grep -v "//" | head -20 || true
          
          echo ""
          echo "===================================================="
          echo "🔍 البحث عن UltraTV في الكود"
          echo "===================================================="
          grep -rn '"UltraTV"\|"Ultra TV"\|"ULTRA TV"' --include="*.kt" . 2>/dev/null | head -10 || true

      # ============================================================
      # 2. تغيير اسم التطبيق والمطور
      # ============================================================
      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅ تم تغيير الاسم والمطور"

      # ============================================================
      # 3. إصلاح الشريط العلوي (CloudPairingDialog.kt)
      # ============================================================
      - name: "Fix TopBar text"
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          if [ ! -f "$TARGET" ]; then
            echo "⚠️ الملف غير موجود"
            exit 0
          fi
          
          echo "===== قبل ====="
          grep -n 'Text("ULTRA' "$TARGET" | head -3 || true
          
          sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
          sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
          sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$TARGET"
          sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
          
          # إزالة letterSpacing
          sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
          sed -i 's|letterSpacing = TextUnit(1\.7f,.*Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
          
          echo "===== بعد ====="
          sed -n '79p' "$TARGET" || true

      # ============================================================
      # 4. استبدال شامل في كل ملفات Kotlin
      # ============================================================
      - name: "Global replace in Kotlin"
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅ تم"

      # ============================================================
      # 5. استبدال في ملفات XML
      # ============================================================
      - name: "Replace in XML files"
        working-directory: source/android-native/app/src/main/res
        run: |
          find . -name "*.xml" -type f | while read f; do
            if grep -qE ">UTV<|>Ultra TV<|>ULTRA TV<|>TV ULTRA<" "$f" 2>/dev/null; then
              sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
            fi
          done
          echo "✅ تم"

      # ============================================================
      # 6. 🎯🔥 إصلاح User-Agent - استبدال دقيق
      # ============================================================
      - name: "Fix User-Agent for stream playback (PRECISE)"
        working-directory: source/android-native
        run: |
          echo "===================================================="
          echo "🎯 إصلاح User-Agent - استبدال دقيق"
          echo "===================================================="
          
          # استبدال "UltraTV/1.0 (Android TV)" الحرفي
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"UltraTV/1\.0 (Android TV)"|"okhttp/4.12.0"|g' "$f"
            sed -i 's|"UltraTV/1\.0"|"okhttp/4.12.0"|g' "$f"
            sed -i 's|"UltraTV"|"okhttp/4.12.0"|g' "$f"
            sed -i 's|"ULTRA TV"|"okhttp/4.12.0"|g' "$f"
            sed -i 's|"Ultra TV"|"okhttp/4.12.0"|g' "$f"
            sed -i 's|"UTV"|"okhttp/4.12.0"|g' "$f"
          done
          
          echo ""
          echo "===== التحقق: هل بقي UltraTV؟ ====="
          REMAINING=$(find . -name "*.kt" -not -path "*/build/*" | xargs grep -l '"UltraTV"\|"Ultra TV"\|"ULTRA TV"' 2>/dev/null | wc -l)
          echo "ملفات لا تزال بها UltraTV: $REMAINING"
          
          echo ""
          echo "===== الملفات المعدلة ====="
          grep -rn 'okhttp/4.12.0' --include="*.kt" . 2>/dev/null | head -10
          
          echo ""
          echo "===== السطر 384 في PlayerScreen.kt بعد التعديل ====="
          sed -n '384p' "app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/player/PlayerScreen.kt" 2>/dev/null || echo "الملف غير موجود"
          
          echo ""
          echo "===== السطر 67 في XmltvParser.kt بعد التعديل ====="
          sed -n '67p' "app/src/main/kotlin/com/ultratv/tv/nativeapp/data/xmltv/XmltvParser.kt" 2>/dev/null || echo "الملف غير موجود"

      # ============================================================
      # 7. دمج المعماريتين في APK واحد
      # ============================================================
      - name: "Configure universal APK (arm64 + armv7)"
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
              echo "✅ تم إضافة abiFilters"
            fi
            
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
              echo "✅ تم إضافة packaging"
            fi
          fi

      # ============================================================
      # 8. إعدادات Gradle
      # ============================================================
      - name: "Setup Gradle properties"
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: "Grant execute permission"
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 9. البناء
      # ============================================================
      - name: "Build APK"
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      # ============================================================
      # 10. التحقق النهائي
      # ============================================================
      - name: "Show APK info"
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;
          
          echo ""
          echo "===== المعماريات المضمنة ====="
          for apk in $(find . -name "*.apk" | head -1); do
            unzip -l "$apk" | grep "\.so$" | awk '{print $4}' | grep -oE "lib/[^/]+" | sort -u
          done

      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-UA-Fixed-V2
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
