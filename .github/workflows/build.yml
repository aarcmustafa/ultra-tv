name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-final3-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-final3-

      # ============================================================
      # 🔍 1. تشخيص: عرض بنية الشريط العلوي
      # ============================================================
      - name: Diagnostic - Analyze TopBar structure
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          echo "===== محتوى CloudPairingDialog.kt (الأسطر 60-100) ====="
          sed -n '60,100p' "$TARGET" 2>/dev/null || echo "الملف غير موجود"
          
          echo ""
          echo "===== كل الأسطر التي تحتوي ULTRA/TV/UTV ====="
          grep -nE '"ULTRA"|"TV"|"Ultra"|"UTV"' "$TARGET" 2>/dev/null | head -20 || true

      # ============================================================
      # 2. تغيير اسم التطبيق والمطور في strings.xml
      # ============================================================
      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
            sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
            sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
          done
          
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
              <string name="developer_name_latin">Djellouli Mustafa</string>
          </resources>
          EOF
          echo "✅ تم تغيير الاسم والمطور"

      # ============================================================
      # 3. 🔥 معالجة الشريط العلوي - تدعم جميع الحالات (مُصحّح)
      # ============================================================
      - name: Smart fix TopBar text (both cases)
        working-directory: source/android-native
        run: |
          TARGET="app/src/main/kotlin/com/ultratv/tv/nativeapp/ui/settings/CloudPairingDialog.kt"
          
          if [ ! -f "$TARGET" ]; then
            echo "⚠️ الملف غير موجود: $TARGET"
            exit 0
          fi
          
          echo "===== قبل المعالجة ====="
          grep -nE 'Text\("(ULTRA|TV|Ultra|UTV)' "$TARGET" | head -10 || true
          
          # ============================================
          # الحالة 1: النص الكامل في Text واحد
          # ============================================
          if grep -qE '"ULTRA TV"|"Ultra TV"|"TV ULTRA"|"UTV"' "$TARGET" 2>/dev/null; then
            echo ""
            echo "🔵 الحالة 1: نص كامل في Text واحد"
            
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$TARGET"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$TARGET"
            
            # إزالة letterSpacing الغريب
            sed -i 's|letterSpacing = TextUnit(1\.7f, TextUnitType\.Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
            sed -i 's|letterSpacing = TextUnit(1\.7f,.*Sp)|letterSpacing = TextUnit(0f, TextUnitType.Sp)|g' "$TARGET"
            
            echo "✅ تم استبدال النص + إزالة letterSpacing"
          fi
          
          # ============================================
          # الحالة 2: النص مقسّم
          # ============================================
          HAS_ULTRA=$(grep -cE 'Text\("ULTRA"\)|Text\("ULTRA",' "$TARGET" 2>/dev/null || echo "0")
          HAS_TV=$(grep -cE 'Text\("TV"\)|Text\("TV",' "$TARGET" 2>/dev/null || echo "0")
          
          if [ "$HAS_ULTRA" -gt 0 ] 2>/dev/null && [ "$HAS_TV" -gt 0 ] 2>/dev/null; then
            echo ""
            echo "🔵 الحالة 2: النص مقسّم"
            
            sed -i 's|Text("ULTRA")|Text("STTITEN IP TV")|g' "$TARGET"
            sed -i 's|Text("ULTRA",|Text("STTITEN IP TV",|g' "$TARGET"
            sed -i 's|Text("TV")|Text("")|g' "$TARGET"
            sed -i 's|Text("TV",|Text("",|g' "$TARGET"
            
            echo "✅ تم استبدال النص المقسّم"
          fi
          
          # ============================================
          # الحالة 3: نص في متغير
          # ============================================
          if grep -qE '=\s*"ULTRA TV"|=\s*"Ultra TV"' "$TARGET" 2>/dev/null; then
            echo ""
            echo "🔵 الحالة 3: النص في متغير"
            sed -i 's|=\s*"ULTRA TV"|= "STTITEN IP TV"|g' "$TARGET"
            sed -i 's|=\s*"Ultra TV"|= "STTITEN IP TV"|g' "$TARGET"
            echo "✅ تم"
          fi
          
          echo ""
          echo "===== بعد المعالجة ====="
          sed -n '75,85p' "$TARGET"
          
          echo ""
          echo "===== التحقق النهائي ====="
          if grep -qE '"ULTRA TV"|"Ultra TV"|"TV ULTRA"|"UTV"' "$TARGET" 2>/dev/null; then
            echo "⚠️ لا يزال النص القديم موجوداً"
            grep -n 'ULTRA\|UTV' "$TARGET" | head -3 || true
          else
            echo "✅ لا يوجد نص قديم"
          fi

      # ============================================================
      # 4. استبدال شامل في كل ملفات Kotlin
      # ============================================================
      - name: Global replace in all Kotlin
        working-directory: source/android-native
        run: |
          find . -name "*.kt" -not -path "*/build/*" | while read f; do
            sed -i 's|"ULTRA TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"Ultra TV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"TV ULTRA"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UltraTV"|"STTITEN IP TV"|g' "$f"
            sed -i 's|"UTV"|"STTITEN IP TV"|g' "$f"
          done
          echo "✅ تم الاستبدال الشامل"

      # ============================================================
      # 5. استبدال في ملفات XML
      # ============================================================
      - name: Replace in XML files
        working-directory: source/android-native/app/src/main/res
        run: |
          find . -name "*.xml" -type f | while read f; do
            if grep -qE ">UTV<|>Ultra TV<|>ULTRA TV<|>TV ULTRA<" "$f" 2>/dev/null; then
              sed -i 's|>UTV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>Ultra TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>ULTRA TV<|>STTITEN IP TV<|g' "$f"
              sed -i 's|>TV ULTRA<|>STTITEN IP TV<|g' "$f"
            fi
          done
          echo "✅ تم"

      # ============================================================
      # 6. دمج المعماريتين في APK واحد
      # ============================================================
      - name: Configure universal APK (arm64 + armv7)
        working-directory: source/android-native
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q 'abiFilters' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        ndk {\n            abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n        }/' "$APP_GRADLE"
              echo "✅ تم إضافة abiFilters"
            fi
            
            if ! grep -q 'useLegacyPackaging' "$APP_GRADLE"; then
              perl -i -pe 's/(android\s*\{)/$1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' "$APP_GRADLE"
              echo "✅ تم إضافة packaging"
            fi
            
            echo ""
            echo "===== التحقق ====="
            grep -n -A 3 "abiFilters" "$APP_GRADLE" | head -8 || true
          fi

      # ============================================================
      # 7. إعدادات Gradle
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      # ============================================================
      # 8. البناء
      # ============================================================
      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Show APK info
        working-directory: source/android-native
        run: |
          echo "===== حجم APK ====="
          find . -name "*.apk" -exec ls -lh {} \;
          
          echo ""
          echo "===== المعماريات المضمنة ====="
          for apk in $(find . -name "*.apk" | head -1); do
            unzip -l "$apk" | grep "\.so$" | awk '{print $4}' | grep -oE "lib/[^/]+" | sort -u
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Universal
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
