name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ultra TV
        uses: actions/checkout@v4
        with:
          repository: khalilbenaz/ultra-tv
          ref: main
          path: source
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-${{ hashFiles('source/android-native/**/*.gradle*') }}
          restore-keys: sttiten-

      # تغيير اسم التطبيق واسم المطور
      - name: Change app name and developer
        working-directory: source/android-native
        run: |
          find . -name "strings.xml" -not -path "*/build/*" | while read f; do
            sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' "$f"
          done
          
          # نضيف developer_name في الملف الافتراضي (values/strings.xml) فقط
          MAIN_STRINGS=$(find app/src/main/res/values -name "strings.xml" | head -1)
          if [ -n "$MAIN_STRINGS" ]; then
            if ! grep -q 'name="developer_name"' "$MAIN_STRINGS"; then
              sed -i 's|</resources>|    <string name="developer_name">Djellouli Mustafa</string>\n</resources>|' "$MAIN_STRINGS"
            fi
          fi
          
          # ملف عربي مخصص
          mkdir -p app/src/main/res/values-ar
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">STTITEN IP TV</string>
              <string name="developer_name">جلولي مصطفى</string>
          </resources>
          EOF
          echo "✅ تم تغيير الاسم والمطور"

      - name: Setup Gradle properties
        working-directory: source/android-native
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission
        working-directory: source/android-native
        run: chmod +x gradlew

      - name: Build APK
        working-directory: source/android-native
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-APK
          path: 'source/android-native/**/*.apk'
          if-no-files-found: error
